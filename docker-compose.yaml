  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chatify_server_container
    ports:
      - "5001:5001"
    volumes:
      - ./server:/app
     
    env_file:
      - ./server/.env
    depends_on:
      - mongodb
      - redis-cache

  mongodb:
    image: mongo:8
    container_name: chatify_db_container
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db

  redis-cache:
    image: redis:7-alpine
    container_name: chatify_redis_container
    ports:
      - "6380:6379"

    # Configure Redis as a volatile cache
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

