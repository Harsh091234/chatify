  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chatify_server_container
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"  
    
     
    env_file:
      - ./server/.env
    depends_on:
      - redis-cache
        
    networks:
      - chatify_network

  

  redis-cache:
    image: redis:7-alpine
    container_name: chatify_redis_container
    restart: unless-stopped
    ports:
      - "6380:6379"

    # Configure Redis as a volatile cache
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - chatify_network

